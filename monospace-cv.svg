<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Monospace CV — a profile rendered as a fenced code block on a README">
  <title>Monospace CV</title>
  <desc>What this template actually produces: a fenced code block sitting on a README page. No window chrome, because there is no window — the shell prompt is a convention inside the text, not an application.</desc>
  <defs>
    <linearGradient id="mc-typing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>

  <!-- The README surface, not a terminal. -->
  <rect width="1200" height="420" fill="#0d1117"/>

  <!-- A rendered markdown heading, to place the block on a page -->
  <text x="72" y="66" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="600" fill="#e6edf3">Jane Doe</text>
  <line x1="72" y1="82" x2="1128" y2="82" stroke="#21262d" stroke-width="1"/>
  <text x="72" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Frontend engineer. The whole profile is one fenced block.</text>

  <!-- The fenced block itself: GitHub's code surface, a hairline border, a
       radius — and nothing else. -->
  <rect x="72" y="132" width="1056" height="196" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="1112" y="152" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2">bash</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5">
    <text x="96" y="170"><tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
    <text x="96" y="192" fill="#9aa4b0">jane.doe — frontend.eng · istanbul, tr</text>

    <text x="96" y="226"><tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9"> cat skills.txt</tspan></text>
    <text x="96" y="248" fill="#9aa4b0">typescript · react · node · figma · css</text>

    <text x="96" y="282"><tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9"> contact --all</tspan></text>
    <text x="96" y="304"><tspan fill="#58a6ff">→ jane.dev</tspan><tspan fill="#484f58">   ·   </tspan><tspan fill="#58a6ff">@janedoe</tspan><tspan fill="#484f58">   ·   </tspan><tspan fill="#58a6ff">in/janedoe</tspan></text>
  </g>

  <!-- The optional typing line that sits under the block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
    <text x="72" y="366" fill="url(#mc-typing)">shipping the design system at acme</text>
    <rect x="352" y="354" width="8" height="15" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="1128" y="366" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2.5">OPTIONAL · readme-typing-svg</text>
</svg>
