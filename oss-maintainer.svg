<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="OSS Maintainer — what you maintain, how fast you answer, and where to start">
  <title>OSS Maintainer</title>
  <desc>A maintainer card that sets expectations before anyone opens an issue: response times, triage days, and a live count of good first issues.</desc>
  <defs>
    <linearGradient id="om-spon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db61a2"/><stop offset="1" stop-color="#bf4b8a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#0d1117"/>

  <!-- Identity -->
  <text x="72" y="66" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#e6edf3">Jane Doe</text>
  <text x="72" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#7d8590" letter-spacing="3.5">MAINTAINER SINCE 2019 · 3 PROJECTS · MIT</text>
  <g>
    <rect x="936" y="44" width="192" height="38" rx="19" fill="none" stroke="#db61a2" stroke-width="1.4"/>
    <path d="M982 63 c-8 -8 -14 -12 -14 -18 a6 6 0 0 1 11 -3 a6 6 0 0 1 11 3 c0 6 -6 10 -14 18 z" fill="url(#om-spon)"/>
    <text x="1056" y="68" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#db61a2" letter-spacing="1.5">SPONSOR</text>
  </g>

  <line x1="72" y1="110" x2="1128" y2="110" stroke="#21262d"/>

  <!-- Projects. Stars are the least interesting column here, so they are the
       smallest: what a contributor needs is whether the thing is alive. -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#7d8590" letter-spacing="2.5">
    <text x="72" y="134">PROJECT</text>
    <text x="596" y="134">STARS</text>
    <text x="716" y="134">OPEN</text>
    <text x="832" y="134">GOOD FIRST</text>
    <text x="1128" y="134" text-anchor="end">LAST RELEASE</text>
  </g>

  <g>
    <line x1="72" y1="146" x2="1128" y2="146" stroke="#21262d"/>
    <text x="72" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#58a6ff">acme-design-system</text>
    <text x="72" y="196" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#7d8590">token pipeline · 412 components · used by 14 teams</text>
    <text x="596" y="180" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3">1,243</text>
    <text x="716" y="180" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3">18</text>
    <rect x="832" y="164" width="34" height="22" rx="11" fill="#1f3a2c"/>
    <text x="849" y="180" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3fb950">6</text>
    <text x="1128" y="180" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">v3.2.0 · 9d ago</text>
  </g>

  <g>
    <line x1="72" y1="212" x2="1128" y2="212" stroke="#21262d"/>
    <text x="72" y="242" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#58a6ff">type-observatory</text>
    <text x="72" y="262" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#7d8590">variable-font inspector · webgl · zero deps</text>
    <text x="596" y="246" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3">684</text>
    <text x="716" y="246" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3">7</text>
    <rect x="832" y="230" width="34" height="22" rx="11" fill="#1f3a2c"/>
    <text x="849" y="246" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3fb950">3</text>
    <text x="1128" y="246" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">v1.4.1 · 6w ago</text>
  </g>

  <g>
    <line x1="72" y1="278" x2="1128" y2="278" stroke="#21262d"/>
    <text x="72" y="308" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#58a6ff">runtime</text>
    <text x="72" y="328" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#7d8590">essays on shipping interfaces · looking for co-maintainers</text>
    <text x="596" y="312" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3">210</text>
    <text x="716" y="312" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3">2</text>
    <rect x="832" y="296" width="34" height="22" rx="11" fill="#1f3a2c"/>
    <text x="849" y="312" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3fb950">4</text>
    <text x="1128" y="312" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">v0.9.0 · 4mo ago</text>
  </g>

  <!-- Expectations. This is the part that saves everyone's time. -->
  <line x1="72" y1="344" x2="1128" y2="344" stroke="#21262d"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="72" y="366" font-size="9" fill="#7d8590" letter-spacing="2.5">FIRST RESPONSE</text>
    <text x="72" y="390" font-size="15" font-weight="700" fill="#e6edf3">within 72h</text>
    <text x="264" y="366" font-size="9" fill="#7d8590" letter-spacing="2.5">TRIAGE DAY</text>
    <text x="264" y="390" font-size="15" font-weight="700" fill="#e6edf3">Thursdays</text>
    <text x="452" y="366" font-size="9" fill="#7d8590" letter-spacing="2.5">PR REVIEW</text>
    <text x="452" y="390" font-size="15" font-weight="700" fill="#e6edf3">1–2 weeks</text>
    <text x="656" y="366" font-size="9" fill="#7d8590" letter-spacing="2.5">SECURITY</text>
    <text x="656" y="390" font-size="15" font-weight="700" fill="#f0883e">SECURITY.md</text>
    <text x="1128" y="366" text-anchor="end" font-size="9" fill="#7d8590" letter-spacing="2.5">START HERE</text>
    <text x="1128" y="390" text-anchor="end" font-size="15" font-weight="700" fill="#3fb950">13 good first issues</text>
  </g>
</svg>
